# Copy to config/local.yml (or point COREAI_LOCAL_FILE at a file). See docs/local-models.md.
# Each server becomes a provider named after its key. Capabilities default to OFF
# (except json_mode): turn on only what the model really does.
servers:
  lmstudio:                       # preset URL: http://localhost:1234/v1
    capabilities:
      default: {tools: false, vision: false, context_length: 8192}
      "qwen2.5-7b-instruct": {tools: true, context_length: 32768}
  ollama:                         # preset URL: http://localhost:11434/v1
    models: [llama3.2]            # optional; also discovered from /v1/models at startup
  gpu-box:
    base_url: http://192.168.1.50:8000/v1    # e.g. vLLM
    api_key_env: GPU_BOX_KEY                 # optional
    cost_per_hour_usd: 0.35                  # optional hardware/electricity estimate

# Managed runtime: drop .gguf files in models_dir; CaiPS runs llama-server for you.
# managed:
#   models_dir: models
#   binary: llama-server        # optional; found on PATH by default
#   max_loaded: 1               # LRU-evict beyond this
#   idle_timeout_s: 600
#   max_queue: 4                # "busy" instead of piling requests on the server
#   capabilities: {"qwen2.5-7b-instruct": {vision: false}}
