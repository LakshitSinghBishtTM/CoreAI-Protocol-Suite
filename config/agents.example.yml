# Copy to config/agents.yml to enable the run API (/v1/runs).
# Agents are defined here, never in a request. A caller can only start an
# agent whose allowed_tools are all granted to it in config/tools.yml.
db: data/runs.db
agents:
  helper:
    system_prompt: You are a careful assistant. Use tools when they help, then answer briefly.
    # model: gpt-4o-mini            # or leave unset to use routing
    allowed_tools: [calculator]
    max_steps: 10
    max_cost_usd: 0.25
    deadline_s: 120
    # approval_tools: [shell]       # always ask a human first
    # plan: true                   # one planning call before the first step
    # local: true                   # small local model: tighter limits

# Unattended runs. Each trigger starts a normal run of one of the agents above,
# with that agent's limits. Set exactly one of every_s or event.
# triggers:
#   nightly-report:
#     every_s: 86400
#     agent: reporter
#     task: "Summarize yesterday's usage."
#     max_per_hour: 1
#   outage-triage:
#     event: provider.outage          # also budget.exceeded, run.finished ...
#     match: {provider: openai}
#     agent: reporter
#     task: "Provider $provider is down; check status and summarize impact."

# Fixed-step workflows: the order is set here, no model chooses what runs next.
# Run with POST /v1/workflows/{name}/run or `caips workflows run NAME INPUT`.
# Tools used must be granted to the caller. ${input} and ${step_id} are templates.
# workflows:
#   explain-math:
#     max_cost_usd: 0.05
#     steps:
#       - {id: calc, tool: calculator, args: {expression: "${input}"}}
#       - {id: say, prompt: "Explain this result in one sentence: ${calc}"}

# More trigger kinds (set exactly one of every_s, cron, webhook_secret_env, event):
#   weekday-digest:
#     cron: "0 8 * * 1-5"             # UTC, five fields
#     agent: reporter
#     task: "Daily digest."
#   from-ci:
#     webhook_secret_env: CI_HOOK_SECRET   # POST /v1/triggers/from-ci/fire, HMAC-signed
#     agent: reporter
#     task: "Build $status on $branch: summarize."
