name: Mirrors

on:
  push:
  create:
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirrors
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps: 
      - name: Mirror repository to all platforms
        shell: bash
        run: |
          set -e

          REPO="snowflake"
          GH_USER="LakshitSinghBishtTM"
          LOWER_USER="lakshitsinghbishttm"

          echo "Cloning GitHub source..."
          git clone --mirror https://github.com/$GH_USER/$REPO.git
          cd $REPO.git

          echo "Removing GitHub PR refs..."
          git for-each-ref --format="%(refname)" refs/pull/ | while read ref; do
            git update-ref -d "$ref"
          done

          echo "Pushing to GitLab..."
          git push --mirror https://oauth2:${{ secrets.GITLAB_CoreAI }}@gitlab.com/$LOWER_USER/$REPO.git || echo "[warn] GitLab push failed"

          echo "Pushing to Codeberg..."
          git push --mirror https://oauth2:${{ secrets.CODEBERG_CoreAI }}@codeberg.org/$LOWER_USER/$REPO.git || echo "[warn] Codeberg push failed"

          echo "Pushing to Gitea..."
          git push --mirror https://${{ secrets.GITEA_CoreAI }}@gitea.com/$GH_USER/$REPO.git || echo "[warn] Gitea push failed"

          echo "Pushing to Bitbucket..."
          git push --mirror https://x-token-auth:${{ secrets.BITBUCKET_CoreAI }}@bitbucket.org/$LOWER_USER/$REPO.git || echo "[warn] Bitbucket push failed"

          echo "[done] All mirror attempts completed."