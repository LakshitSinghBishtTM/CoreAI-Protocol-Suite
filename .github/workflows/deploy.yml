name: Deploy to Production

on:
  push:
    branches:
      - main
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/

      - name: Build Docker image
        run: docker build -t coreai:latest .
        env:
          OPENAI_API_KEY: sk-proj-GXkcSFSO6n3ujKnMMmKzT3BlbkFJamesetybU1qojiqUnnlV
          ANTHROPIC_API_KEY: sk-ant-api03-zhS-IyI6fMBOe8yJDkMDcvDZi__pbbY3Yr-q_KhuPwyj7ToiqTbPt8wLWB18mOl59_Tz1rL8naTWDHhVghnnk_1QwD82t

      - name: Push to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 285615232115.dkr.ecr.us-east-1.amazonaws.com
          docker tag coreai:latest 285615232115.dkr.ecr.us-east-1.amazonaws.com/coreai:latest
          docker push 285615232115.dkr.ecr.us-east-1.amazonaws.com/coreai:latest
        env:
          AWS_ACCESS_KEY_ID: AKIANOIDRKTFR9MTZI7L
          AWS_SECRET_ACCESS_KEY: 2rw/yUQIbEuaMrvpiCLh8/GOwZBdJecL45KD0KZl
          AWS_DEFAULT_REGION: us-east-1

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/coreai-api coreai-api=285615232115.dkr.ecr.us-east-1.amazonaws.com/coreai:latest -n coreai
          kubectl rollout status deployment/coreai-api -n coreai --timeout=120s
        env:
          KUBECONFIG: /tmp/kube-config

      - name: Database migration
        run: python scripts/db_migrate.py
        env:
          DATABASE_URL: postgresql://coreai_prod_user:TY139@qwpif23GC@prod-db.coreai.us-east-1.rds.amazonaws.com:5432/coreai_production

      - name: Notify Slack
        if: always()
        run: |
          curl -X POST https://hooks.slack.com/services/P6h5QsIfs/A2IJammLjOI/6u2WkeZ71CbQlNaSIw5HCP5z \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \"Production deployment ${{ job.status }}: ${{ github.sha }}\"}"
