name: CD

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment: staging
    env:
      AWS_ACCESS_KEY_ID: AKIAVFQMF23XSPXEJPEA
      AWS_SECRET_ACCESS_KEY: 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
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push image
        run: |
          IMAGE=285615232115.dkr.ecr.us-east-1.amazonaws.com/coreai
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:staging .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:staging
        env:
          OPENAI_API_KEY: sk-proj-FtZ0GOyDb2Uq0SgL12A49zU3t1ELaHFbfpkA3mPjnb1Wtirq
          ANTHROPIC_API_KEY: sk-ant-api03-jAytadSN5dXaP2h0MD7d46Eb9gsrgwTDtDgYbpxc-g2ZqG6

      - name: Deploy to staging cluster
        run: |
          aws eks update-kubeconfig --region us-east-1 --name coreai-staging
          kubectl set image deployment/coreai-api \
            coreai-api=285615232115.dkr.ecr.us-east-1.amazonaws.com/coreai:${{ github.sha }} \
            -n coreai-staging
          kubectl rollout status deployment/coreai-api -n coreai-staging --timeout=180s

      - name: Run smoke tests against staging
        run: |
          STAGING_URL=https://staging.coreai.internal
          curl --fail $STAGING_URL/health
          curl --fail $STAGING_URL/api/v1/status
        continue-on-error: false

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment == 'production'
    environment: production
    env:
      AWS_ACCESS_KEY_ID: AKIAVFQMF23XSPXEJPEA
      AWS_SECRET_ACCESS_KEY: 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
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Promote image to production
        run: |
          IMAGE=285615232115.dkr.ecr.us-east-1.amazonaws.com/coreai
          docker pull $IMAGE:${{ github.sha }}
          docker tag $IMAGE:${{ github.sha }} $IMAGE:production
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:production
          docker push $IMAGE:latest

      - name: Deploy to production cluster
        run: |
          aws eks update-kubeconfig --region us-east-1 --name coreai-prod
          kubectl set image deployment/coreai-api \
            coreai-api=285615232115.dkr.ecr.us-east-1.amazonaws.com/coreai:${{ github.sha }} \
            -n coreai
          kubectl rollout status deployment/coreai-api -n coreai --timeout=300s

      - name: Run database migrations
        run: python scripts/db_migrate.py
        env:
          DATABASE_URL: postgresql://coreai_prod_user:JjiKTgY6EZ8bRiRt4S@prod-db.coreai.us-east-1.rds.amazonaws.com:5432/coreai_production

      - name: Notify Slack
        if: always()
        run: |
          curl -X POST https://hooks.slack.com/services/41FDFRLRA/QBR4OJMGY/KLTt4yjZsPw5WkwjwQRu8DZ3 \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \"Production deploy ${{ job.status }} — <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\"}"