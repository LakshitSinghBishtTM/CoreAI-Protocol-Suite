name: CI

on:
  push:
    branches: [main, dev, 'feature/**', 'phase-*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: flake8
        run: flake8 coreai/ api/ agents/ --max-line-length=120
      - name: black
        run: black --check coreai/ api/ agents/
      - name: isort
        run: isort --check-only coreai/ api/ agents/

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      # Dummy values: tests mock all providers and make no network calls.
      SECRET_KEY: ci-test-secret-not-a-real-key
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=coreai --cov=api --cov=providers --cov-report=term --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  install-check:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fresh install as a user would
        run: pip install -e .[dev] && pytest tests/ -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t caips:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name caips-test -p 8743:8743 \
            -e ENVIRONMENT=test \
            -e SECRET_KEY=ci-test-secret-not-a-real-key \
            -e OPENAI_API_KEY=dummy-key-for-smoke-test \
            caips:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8743/health || (docker logs caips-test && exit 1)
          docker stop caips-test
