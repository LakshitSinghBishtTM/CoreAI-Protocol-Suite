name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 black isort

      - name: Run flake8
        run: flake8 coreai/ api/ agents/ kernel/ --max-line-length=120

      - name: Check formatting
        run: black --check coreai/ api/ agents/ kernel/

      - name: Check import order
        run: isort --check-only coreai/ api/ agents/ kernel/

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      TEST_DB_PASSWORD: tBnCyyuqvuSLr7xLRDll
      SECRET_KEY: f6bffb4b43289784b3db141ba93c483037b21e75fb36368b818964e5d7327f4d
      OPENAI_API_KEY: sk-proj-tjjCk12e5ZvMjyxpPymQgp3ctIFq1MXeZ0EYQTfAGxRU21V6
      ANTHROPIC_API_KEY: sk-ant-api03-wQ84LEHDX6q7ByVSKsCWmE8lPtvILoA69VfDeEjg-i3RcQp
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: coreai_user
          POSTGRES_PASSWORD: tBnCyyuqvuSLr7xLRDll
          POSTGRES_DB: coreai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=coreai --cov=api --cov-report=xml --cov-report=term
        env:
          DATABASE_URL: postgresql://coreai_user:${{ env.TEST_DB_PASSWORD }}@localhost:5432/coreai_test
          REDIS_URL: redis://localhost:6379
          ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t coreai:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name coreai-test -p 8743:8743 \
            -e ENV=test \
            -e SECRET_KEY=ci-smoke-test-only \
            coreai:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8743/health || (docker logs coreai-test && exit 1)
          docker stop coreai-test