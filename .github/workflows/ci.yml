name: CI

on:
  push:
    branches: [main, dev, 'feature/**', 'phase-*']
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: ruff
        run: ruff check coreai/ api/ agents/
      - name: black
        run: black --check coreai/ api/ agents/
      - name: mypy (files already clean)
        run: mypy providers/base.py

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      # Dummy values: tests mock all providers and make no network calls.
      SECRET_KEY: ci-test-secret-not-a-real-key
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=coreai --cov=api --cov=providers --cov-report=term --cov-report=xml
      - name: Chaos check (provider failure scenarios)
        if: matrix.python-version == '3.12'
        run: python scripts/chaos.py
      - name: Load test (memory stays bounded)
        if: matrix.python-version == '3.12'
        run: python scripts/loadtest.py
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  package:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel and install it into a clean environment
        run: |
          pip install build
          python -m build
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python -c "import coreai, api, agents, protocols, neural, providers, database; print(coreai.__version__)"

  build:
    runs-on: ubuntu-latest
    needs: [test, package]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t caips:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name caips-test -p 8743:8743 \
            -e ENVIRONMENT=test \
            -e SECRET_KEY=ci-test-secret-not-a-real-key \
            -e OPENAI_API_KEY=dummy-key-for-smoke-test \
            caips:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8743/health || (docker logs caips-test && exit 1)
          docker stop caips-test
