name: Publish

# PyPI trusted publishing: no API token is stored. Configure the project on
# pypi.org (Publishing > Add a trusted publisher) with workflow "publish.yml"
# and environment "pypi", then push a tag like v1.0.0.
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag must match package version
        run: |
          pip install -e .
          test "v$(python -c 'import coreai; print(coreai.__version__)')" = "$GITHUB_REF_NAME"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
