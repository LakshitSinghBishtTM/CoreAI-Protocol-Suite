[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coreai-protocol-suite"
description = "Multi-provider LLM gateway with routing, failover, caching and rate limiting (alpha)"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Lakshit Singh Bisht" }]
keywords = ["llm", "gateway", "routing", "openai", "anthropic", "gemini", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",  # FastAPI TestClient and scripts/benchmark.py
    "redis>=5.0.0",  # so the Redis cache tests run in CI
    "asyncpg>=0.29.0",  # Postgres db_query tests
    "pgserver>=0.1.4",  # throwaway Postgres for tests
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "build>=1.2.0",
    "opentelemetry-sdk>=1.25.0",  # so the tracing tests run in CI
]
postgres = ["asyncpg>=0.29.0"]
# Redis cache backend (falls back to in-memory cache when absent).
redis = ["redis>=5.0.0"]
# Optional OpenTelemetry tracing (see docs/operations.md).
tracing = [
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
]

[project.urls]
Repository = "https://github.com/LakshitSinghBishtTM/CoreAI-Protocol-Suite"
Issues = "https://github.com/LakshitSinghBishtTM/CoreAI-Protocol-Suite/issues"

# Runtime dependencies live in requirements.txt so the Dockerfile and the
# package install the same set. Version lives in coreai/_version.py.
[project.scripts]
caips = "caips_cli.cli:main"

[tool.setuptools.dynamic]
version = { attr = "coreai._version.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"src/providers/__init__.py" = ["F401"]
"src/providers/*.py" = ["E402"]
"tests/*" = ["E402", "E501", "F811"]
"src/tools/config.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
mypy_path = "src"
explicit_package_bases = true
# Ratchet: `mypy` (no arguments) checks the clean files below. When you fix a
# file, add it here; never remove one.
files = [
    "src/api/__init__.py",
    "src/api/anthropic_compat.py",
    "src/api/auth.py",
    "src/api/middleware.py",
    "src/api/openai_compat.py",
    "src/coreai/__init__.py",
    "src/coreai/_paths.py",
    "src/coreai/_version.py",
    "src/coreai/audit.py",
    "src/coreai/circuit_breaker.py",
    "src/coreai/deadline.py",
    "src/coreai/drain.py",
    "src/coreai/errors.py",
    "src/coreai/health.py",
    "src/coreai/kernel.py",
    "src/coreai/limiter.py",
    "src/coreai/memory_manager.py",
    "src/coreai/metrics.py",
    "src/coreai/policy.py",
    "src/coreai/pricing.py",
    "src/coreai/request_context.py",
    "src/coreai/retry.py",
    "src/coreai/scheduler.py",
    "src/coreai/tracing.py",
    "src/coreai/usage.py",
    "src/database/migrations.py",
    "src/database/models.py",
    "src/middleware/__init__.py",
    "src/middleware/logger.py",
    "src/middleware/validator.py",
    "src/providers/__init__.py",
    "src/providers/base.py",
    "src/providers/local.py",
    "src/providers/deepseek.py",
    "src/providers/grok.py",
    "src/providers/openai.py",
    "src/utils/__init__.py",
    "src/utils/cost.py",
    "src/utils/tokens.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai.types",
]
