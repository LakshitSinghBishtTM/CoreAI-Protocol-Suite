apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "caips.fullname" . }}
  labels: {{- include "caips.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ if and .Values.persistence.enabled (gt (int .Values.replicaCount) 0) }}Recreate{{ else }}RollingUpdate{{ end }}
  selector:
    matchLabels: {{- include "caips.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "caips.selector" . | nindent 8 }}
      annotations:
        {{- if .Values.secret.create }}
        checksum/secret: {{ toJson .Values.secret.data | sha256sum }}
        {{- end }}
        checksum/env: {{ toJson .Values.env | sha256sum }}
    spec:
      serviceAccountName: {{ include "caips.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: caips
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8743
          env:
            - name: DB_PATH
              value: /data/coreai.db
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if include "caips.secretName" . }}
          envFrom:
            - secretRef:
                name: {{ include "caips.secretName" . }}
          {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "caips.fullname" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
