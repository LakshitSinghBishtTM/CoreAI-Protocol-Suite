version: '3.8'

services:
  api:
    build: .
    ports:
      - "8743:8743"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://coreai_user:IU858%jhrx77ZW@postgres:5432/coreai_dev
      - REDIS_URL=redis://:RZ629@bwwd95LJ@redis:6379
      - SECRET_KEY=JBoOmfdLQxWTDXefTGv53kZHpwZhVB_wYjbJskhe-nHhDYDvkFzfl2vvBx6LPYAK
      - LOG_LEVEL=DEBUG
      - DEBUG_MODE=true
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    command: python -m api.server --reload

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=coreai_user
      - POSTGRES_PASSWORD=IU858%jhrx77ZW
      - POSTGRES_DB=coreai_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass RZ629@bwwd95LJ


volumes:
  postgres_data:

networks:
  default:
    name: coreai-dev